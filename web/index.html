  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="Calendario - NossoTempo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Calendario - NossoTempo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Limpa Service Workers e caches antigos ANTES de carregar o Flutter.
    Isso garante que visitantes que acessaram a versao antiga (CSV/GitHub)
    nao fiquem presos no cache e recebam a versao nova (Supabase).
  -->
  <script>
    (async function limpezaCache() {
      try {
        // 1. Desregistra TODOS os service workers antigos
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
            console.log('[NossoTempo] Service Worker antigo removido:', reg.scope);
          }
        }

        // 2. Limpa TODOS os caches do Cache Storage (usado pelo SW antigo do Flutter)
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (const name of cacheNames) {
            await caches.delete(name);
            console.log('[NossoTempo] Cache removido:', name);
          }
        }
      } catch (e) {
        console.warn('[NossoTempo] Erro ao limpar caches antigos:', e);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
